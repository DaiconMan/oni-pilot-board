<!doctype html>
<html lang="ja" class="board-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oni-pilot 作戦ボード</title>
<style>
/* Shared overlay styles. Large text for viewers new to the game; dark translucent background over the game capture.
   Colour roles: warning = red (orange for medium risk), decision = yellow, everything else = shades of white/grey. */
:root { --warn: #ff5c5c; --caution: #ffa64d; --decide: #ffd84d; --fg: #f4f4f4; --dim: #b4b4b4; --faint: #8a8a8a; }
html, body { margin: 0; padding: 0; overflow: hidden; }
body {
  color: var(--fg);
  font-family: "Noto Sans CJK JP", "Noto Sans JP", Meiryo, "Yu Gothic", sans-serif;
  line-height: 1.35;
  position: relative;
}
h2 { font-size: 20px; font-weight: normal; letter-spacing: 0.05em; color: var(--dim); margin: 0 0 4px;
     border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 2px; white-space: nowrap; }
#root { width: 100%; height: 100%; box-sizing: border-box; }
.warn-text { color: var(--warn); font-weight: bold; }
small { font-size: 0.75em; color: var(--dim); font-weight: normal; }

.stale {
  position: absolute; top: 10px; right: 16px; z-index: 5;
  font-size: 24px; padding: 2px 12px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.2); color: var(--fg);
}
.banner {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(10, 15, 30, 0.85); color: #fff; font-size: 72px; font-weight: bold;
}
.banner small { font-size: 48px; color: #fff; }

/* thinking.html: 作戦ボード, right strip 600x1080 over the game.
   Visual weight top to bottom: goal/milestones > todo > risks > decisions > thoughts. */
body.thinking-page { width: 600px; height: 1080px; background: rgba(0, 0, 0, 0.55); }
body.thinking-page #root { display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 12px; }

.board { display: flex; justify-content: space-between; align-items: baseline; }
.board h1 { margin: 0; font-size: 30px; letter-spacing: 0.1em; }
.board small { font-size: 16px; color: var(--faint); }
.goal-line { font-size: 24px; font-weight: bold; margin-top: -8px; }

.plan ol, .todo ol, .decisions ol, .risks ul { margin: 0; padding: 0; }
.plan ol, .decisions ol, .risks ul { list-style: none; }
.step { display: flex; gap: 10px; font-size: 22px; line-height: 1.4; color: var(--dim); }
.step i { font-style: normal; flex: 0 0 1.2em; text-align: center; }
.step.done { color: var(--faint); }
.step.active { font-size: 28px; font-weight: bold; color: var(--fg); }
.step.active small.note { display: block; font-size: 20px; font-weight: normal; color: var(--fg); }
.step.blocked { color: var(--warn); }

.todo ol { padding-left: 1.6em; font-size: 22px; color: var(--fg); }
.todo li.next { font-size: 26px; font-weight: bold; }
.todo li.done { text-decoration: line-through; color: var(--faint); font-size: 20px; }
.todo li::marker { color: var(--dim); }
.todo .tag { font-size: 16px; font-weight: bold; color: #000; background: var(--fg); border-radius: 4px; padding: 0 5px; margin-right: 8px; vertical-align: 3px; }

.risks li { font-size: 22px; line-height: 1.25; border-left: 4px solid var(--faint); padding-left: 10px; margin-bottom: 5px; }
.risks li small { display: block; font-size: 18px; }
.risks li.sev3 { border-left-color: var(--warn); color: var(--warn); font-weight: bold; }
.risks li.sev2 { border-left-color: var(--caution); color: var(--caution); }
.risks li.sev1 { color: var(--dim); }

.decision-item { border-left: 4px solid rgba(255, 255, 255, 0.25); padding: 0 0 0 10px; margin-bottom: 4px; font-size: 20px; color: var(--dim);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.decision-item .meta { font-size: 16px; color: var(--faint); }
.decision-item.latest { border-left-color: var(--decide); white-space: normal; }
.decision-item.latest .decision { font-size: 26px; font-weight: bold; color: var(--decide); line-height: 1.25; }
.decision-item .sub { font-size: 20px; color: var(--dim); }
.decision-item .doubting { color: var(--faint); }

.thinking { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* newest paragraph sits at the bottom; older ones fade out of the top */
.stream { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 32px); mask-image: linear-gradient(to bottom, transparent 0, #000 32px); }
.stream p { margin: 0 0 6px; font-size: 24px; line-height: 1.4; word-break: break-all; color: var(--dim); }
.stream time { font-size: 16px; color: var(--faint); margin-right: 8px; }
.tools { font-size: 16px; color: var(--faint); margin-top: 2px; }

/* colony.html: vitals / status strip 1320x200, left of the right strip */
body.colony-page { width: 1320px; height: 200px; background: rgba(0, 0, 0, 0.6); }
body.colony-page #root { display: flex; gap: 20px; padding: 12px 20px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-around; }
.row { display: flex; gap: 24px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.row1 { font-size: 30px; font-weight: bold; }
.row2 { font-size: 22px; }
.row2 small { font-size: 0.7em; }
.row3 { font-size: 22px; color: var(--dim); }
.goal { color: var(--fg); }

.side { flex: 0 0 470px; min-width: 0; border-left: 1px solid rgba(255, 255, 255, 0.25); padding-left: 20px;
        display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.board-url { font-size: 16px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-main { font-size: 30px; font-weight: bold; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.st-main b { font-size: 36px; }
.dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); }
.dupes { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; }
.dupes .legend { grid-column: 1 / -1; font-size: 16px; color: var(--faint); }
.chip { display: flex; align-items: center; gap: 6px; font-size: 20px; min-width: 0; }
.chip .name { flex: 0 0 4em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chip b { font-size: 16px; font-weight: normal; flex: 0 0 2.6em; }
.chip.more { color: var(--dim); }
.bar { display: inline-block; flex: 1; height: 10px; background: rgba(255, 255, 255, 0.15); border-radius: 5px; overflow: hidden; }
.bar.health { flex: 0 0 36px; }
.bar i { display: block; height: 100%; background: var(--dim); }
.bar.warn i { background: var(--warn); }

/* board.html: the full 作戦ボード page for viewers (browser tab that scrolls; also the GitHub Pages snapshot) */
html.board-html, html.board-html body.board-page { overflow: auto; }
body.board-page { background: #14171c; min-height: 100vh; }
body.board-page #root { max-width: 960px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 22px; }
body.board-page .goal-line { margin-top: -12px; }
body.board-page .step small { display: block; font-size: 16px; color: var(--faint); }
body.board-page .step small.note { font-size: 18px; color: var(--dim); }
body.board-page .step.active small.note { color: var(--fg); }
body.board-page .todo li.done { font-size: 20px; }
body.board-page .decision-item { white-space: normal; margin-bottom: 10px; }
body.board-page .decision-item .decision { font-size: 22px; color: var(--fg); }
body.board-page .decision-item:first-child { border-left-color: var(--decide); }
body.board-page .decision-item:first-child .decision { color: var(--decide); font-weight: bold; }
body.board-page .st-main { font-size: 24px; white-space: normal; }
body.board-page .problems ul { margin: 0; padding-left: 1.4em; }
body.board-page .problems li { font-size: 20px; color: var(--caution); }
body.board-page .stream { -webkit-mask-image: none; mask-image: none; }
.doubt { font-size: 14px; font-weight: bold; color: #000; background: var(--caution); border-radius: 4px; padding: 0 6px; margin-left: 8px; vertical-align: 2px; }
.none { margin: 0; font-size: 18px; color: var(--faint); }
.history table { width: 100%; border-collapse: collapse; font-size: 18px; }
.history th, .history td { text-align: left; vertical-align: top; padding: 4px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
.history th { color: var(--dim); font-weight: normal; white-space: nowrap; }
.history td:first-child { white-space: nowrap; color: var(--dim); }
body.board-page .pb-link { margin: -12px 0 0; font-size: 18px; }
body.board-page .pb-link a { color: var(--dim); }
.playbook ul { margin: 0; padding: 0; list-style: none; }
.pb-rule { margin-bottom: 12px; font-size: 20px; }
.pb-id { color: var(--faint); }
.pb-meta { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--faint); }
.pb-meta .doubt { margin-left: 0; }
.pb-rule small, .pb-facts { display: block; font-size: 16px; color: var(--faint); }
.pb-status { font-weight: normal; font-size: 14px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--faint); }
.pb-status.confirmed { color: #7c7; border-color: #7c7; }
.pb-status.tested { color: #8bf; border-color: #8bf; }
.pb-status.under_test { color: var(--caution); border-color: var(--caution); }
.pb-status.retired { text-decoration: line-through; }
.bar.conf { flex: 0 0 80px; }
</style>
</head>

<script>
// Overlay renderer: subscribes to SSE /events (event: state) and redraws the page from the full State.
// Pure render functions are exported for tests (node); the browser part runs only when a document exists.
"use strict";

const STALE_MS = 30000;
const STRESS_WARN = 40; // shortcut: fixed threshold for the red stress bar; take it from playbook once one exists.
const MAX_DUPE_ROWS = 6;
const STEP_ICON = { done: "✓", active: "▶", todo: "○", blocked: "✕" };
const RISK_CLASS = { 3: "sev3", 2: "sev2" };

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function isUsageLimit(state) {
  const s = state.status || {};
  return s.state === "paused" && s.reason === "usage_limit";
}

function isApiError(state) {
  const s = state.status || {};
  return s.state === "paused" && s.reason === "api_error";
}

function jstHHMM(iso) {
  const d = new Date(iso);
  if (iso == null || isNaN(d)) return "--:--";
  const j = new Date(d.getTime() + 9 * 3600 * 1000);
  return String(j.getUTCHours()).padStart(2, "0") + ":" + String(j.getUTCMinutes()).padStart(2, "0");
}

function chrome(state, now) {
  let html = "";
  const t = Date.parse(state.updated_at);
  if (!isNaN(t) && now.getTime() - t >= STALE_MS) html += '<div class="stale">考え中…</div>';
  return html;
}

// ---- break.html: one full-screen card on top of everything; transparent (empty) unless paused ----

function renderBreak(state) {
  const s = state.status || {};
  const card = (title, when, why) => `<div class="break-screen"><div class="title">${title}</div>` +
    `<div class="when">${esc(when)}</div>${why ? `<div class="why">${why}</div>` : ""}</div>`;
  if (isApiError(state)) {
    return card("接続待ち", `再試行 ${s.attempt ?? "?"} 回目・次 ${s.retry_at ? jstHHMM(s.retry_at) : "未定"}`, "");
  }
  if (s.state === "paused" && s.reason === "stream_stopped") return card("配信停止中（手動で再開してください）", s.note ?? "", "");
  if (!isUsageLimit(state)) return "";
  const at = s.resume_at ? jstHHMM(s.resume_at) : "未定";
  return card("休憩中", s.limit === "weekly" ? `週の上限・再開 ${at}` : `再開予定 ${at}`, "Claude の利用枠を待っています");
}

// state.thoughts ([{ts, text}], newest last) when the server sends it; otherwise split state.thinking.
function paragraphs(state) {
  if (Array.isArray(state.thoughts)) return state.thoughts.map((t) => ({ ts: t.ts, text: t.text }));
  return String(state.thinking ?? "")
    .split("\n")
    .flatMap((line) => line.split(/(?<=。)/))
    .map((s) => s.trim())
    .filter(Boolean)
    .map((text) => ({ ts: null, text }));
}

function bar(value, cls) {
  if (typeof value !== "number") return "";
  const v = Math.max(0, Math.min(100, value));
  return `<span class="bar ${cls}"><i style="width:${v}%"></i></span>`;
}

function warn(d) {
  return typeof d.stress === "number" && d.stress >= STRESS_WARN;
}

function asPlan(state) {
  return state.plan && typeof state.plan === "object" ? state.plan : {};
}

// ---- thinking.html: 作戦ボード (goal > milestones > todo > risks > decisions > thoughts) ----

function renderPlan(plan) {
  const ms = Array.isArray(plan.milestones) ? plan.milestones : [];
  if (!ms.length) return "";
  const steps = ms.map((m) => {
    const st = STEP_ICON[m.status] ? m.status : "todo";
    const note = st === "active" && m.note ? `<small class="note">${esc(m.note)}</small>` : "";
    return `<li class="step ${st}"><i>${STEP_ICON[st]}</i><span>${esc(m.name)}${note}</span></li>`;
  }).join("");
  return `<section class="plan"><h2>目標までの道のり</h2><ol>${steps}</ol></section>`;
}

function renderTodo(todo) {
  if (!todo.length) return "";
  const next = todo.findIndex((t) => !t.done);
  const items = todo.slice(0, 5).map((t, i) =>
    `<li class="${t.done ? "done" : i === next ? "next" : ""}">${i === next ? '<span class="tag">次</span>' : ""}${esc(t.text)}</li>`).join("");
  return `<section class="todo"><h2>いまの予定（優先順）</h2><ol>${items}</ol></section>`;
}

function renderRisks(plan) {
  const risks = (Array.isArray(plan.risks) ? plan.risks : []).slice().sort((a, b) => (b.severity ?? 0) - (a.severity ?? 0)).slice(0, 3);
  if (!risks.length) return "";
  const items = risks.map((r) =>
    `<li class="${RISK_CLASS[r.severity] || "sev1"}">${esc(r.text)}${r.mitigation ? `<small>→ ${esc(r.mitigation)}</small>` : ""}</li>`).join("");
  return `<section class="risks"><h2>リスク</h2><ul>${items}</ul></section>`;
}

function renderThinking(state, now) {
  const todo = Array.isArray(state.todo) ? state.todo : [];
  const plan = asPlan(state);
  // only the newest decision shows its reason; older ones are one line so the plan above keeps its room
  const decisions = (state.decisions || []).slice(todo.length ? -2 : -3).reverse().map((d, i) => i === 0 ? `
    <li class="decision-item latest">
      <div class="meta">${jstHHMM(d.ts)} ｜ サイクル ${esc(d.cycle ?? "-")}</div>
      <div class="decision">${esc(d.decision)}</div>
      <div class="sub">理由: ${esc(d.reason)}</div>
      ${d.doubting ? `<div class="sub doubting">疑っている前提: ${esc(d.doubting)}</div>` : ""}
    </li>` : `
    <li class="decision-item"><span class="meta">${jstHHMM(d.ts)} ｜ サイクル ${esc(d.cycle ?? "-")}</span> ${esc(d.decision)}</li>`).join("");
  const thoughts = paragraphs(state).slice(-30).map((p) =>
    `<p>${p.ts ? `<time>${jstHHMM(p.ts)}</time>` : ""}${esc(p.text)}</p>`).join("");
  const tools = (state.tools || []).slice(-3).map((t) => esc(t.name)).join("・");
  const at = typeof plan.updated_cycle === "number" ? `<small>サイクル ${plan.updated_cycle} 時点</small>` : "";
  const goalLine = plan.goal ? `<div class="goal-line">ゴール: ${esc(plan.goal)}</div>` : "";
  return `
    <header class="board"><h1>作戦ボード</h1>${at}</header>
    ${goalLine}
    ${renderPlan(plan)}
    ${renderTodo(todo)}
    ${renderRisks(plan)}
    <section class="decisions"><h2>直近の決定</h2><ol>${decisions}</ol></section>
    <section class="thinking"><h2>Claude の思考</h2><div class="stream">${thoughts}</div>
      ${tools ? `<div class="tools">直近の操作: ${tools}</div>` : ""}</section>
    ${chrome(state, now)}`;
}

// ---- board.html: the full 作戦ボード for viewers (/board locally, a static snapshot on GitHub Pages) ----

const BOARD_DECISIONS = 20;
const list = (v) => (Array.isArray(v) ? v : []);
const doubt = (x) => (x && x.doubting === true ? '<b class="doubt">疑い中</b>' : "");
const section = (cls, title, body) =>
  `<section class="${cls}"><h2>${title}</h2>${body || '<p class="none">まだありません</p>'}</section>`;

const PB_STATUS = ["confirmed", "tested", "hypothesis", "under_test", "retired"];

function renderPlaybook(state) {
  const conf = (r) => (typeof r.confidence === "number" ? r.confidence : -1);
  return list(state.playbook).slice().sort((a, b) => conf(b) - conf(a)).map((r) => {
    const st = PB_STATUS.includes(r.status) ? r.status : "";
    const meta = [r.evidence ? `根拠: ${esc(r.evidence)}` : "", r.last_verified ? `最終確認: ${esc(r.last_verified)}` : ""]
      .filter(Boolean).join(" ・ ");
    return `<li class="pb-rule"><div><b class="pb-id">${esc(r.id)}</b> ${esc(r.title)}</div>` +
      `<div class="pb-meta">${st ? `<b class="pb-status ${st}">${st}</b>` : ""}` +
      `${st === "under_test" ? '<b class="doubt">疑い中</b>' : ""}` +
      `${conf(r) >= 0 ? `${bar(r.confidence * 100, "conf")}<span>${r.confidence}</span>` : ""}</div>` +
      `${meta ? `<small>${meta}</small>` : ""}</li>`;
  }).join("");
}

function renderBoard(state) {
  const plan = asPlan(state);
  const steps = list(plan.milestones).map((m) => {
    const st = STEP_ICON[m.status] ? m.status : "todo";
    const meta = [m.basis ? `根拠: ${esc(m.basis)}` : "", typeof m.target_cycle === "number" ? `目標 サイクル ${m.target_cycle}` : ""]
      .filter(Boolean).join(" ・ ");
    return `<li class="step ${st}"><i>${STEP_ICON[st]}</i><span>${esc(m.name)}${doubt(m)}` +
      `${m.note ? `<small class="note">${esc(m.note)}</small>` : ""}${meta ? `<small>${meta}</small>` : ""}</span></li>`;
  }).join("");
  const risks = list(plan.risks).slice().sort((a, b) => (b.severity ?? 0) - (a.severity ?? 0)).map((r) =>
    `<li class="${RISK_CLASS[r.severity] || "sev1"}">${esc(r.text)}${doubt(r)}` +
    `${r.mitigation ? `<small>対策: ${esc(r.mitigation)}</small>` : ""}${r.basis ? `<small>根拠: ${esc(r.basis)}</small>` : ""}</li>`).join("");
  const todo = list(state.todo).map((t) => `<li class="${t.done ? "done" : ""}">${esc(t.text)}</li>`).join("");
  const decisions = list(state.decisions).slice(-BOARD_DECISIONS).reverse().map((d) => `
    <li class="decision-item"><div class="meta">${jstHHMM(d.ts)} ｜ サイクル ${esc(d.cycle ?? "-")}</div>
      ${d.situation ? `<div class="sub">状況: ${esc(d.situation)}</div>` : ""}
      <div class="decision">${esc(d.decision)}</div>
      <div class="sub">理由: ${esc(d.reason)}</div>
      ${d.doubting ? `<div class="sub doubting">疑っている前提: ${esc(d.doubting)}</div>` : ""}</li>`).join("");
  const history = list(state.plan_history).map((h) =>
    `<tr><td>${esc(h.cycle)}</td><td>${esc(h.change)}</td><td>${esc(h.reason)}</td></tr>`).join("");
  const problems = list(plan.problems).map((p) => `<li>${esc(p.text)}</li>`).join("");
  const thoughts = paragraphs(state).slice(-8).map((p) =>
    `<p>${p.ts ? `<time>${jstHHMM(p.ts)}</time>` : ""}${esc(p.text)}</p>`).join("");
  const rules = renderPlaybook(state);
  const facts = typeof state.game_facts_count === "number"
    ? `<p class="pb-facts">ゲーム仕様の事実 ${state.game_facts_count} 件（全文は playbook.html）</p>` : "";
  const at = typeof plan.updated_cycle === "number" ? ` ・ 作戦はサイクル ${plan.updated_cycle} 時点` : "";
  // no 考え中…: a published snapshot is minutes old by design, so the update time is shown instead
  return `
    <header class="board"><h1>作戦ボード</h1>
      <small>${esc(state.run || "run-?")} ・ 更新 ${jstHHMM(state.updated_at)}（日本時間）${at}</small></header>
    <p class="pb-link"><a href="playbook.html">学んだ規則の全文 → playbook.html</a></p>
    ${plan.goal ? `<div class="goal-line">ゴール: ${esc(plan.goal)}</div>` : ""}
    ${section("status", "いまの状態", statusLine(state))}
    ${section("plan", "目標までの道のり", steps && `<ol>${steps}</ol>`)}
    ${section("risks", "リスク（深刻な順）", risks && `<ul>${risks}</ul>`)}
    ${section("todo", "いまの予定（優先順）", todo && `<ol>${todo}</ol>`)}
    ${section("decisions", `直近の決定（新しい順・最大 ${BOARD_DECISIONS} 件）`, decisions && `<ol>${decisions}</ol>`)}
    ${section("history", "作戦の変遷", history &&
      `<table><thead><tr><th>サイクル</th><th>変えた点</th><th>理由</th></tr></thead><tbody>${history}</tbody></table>`)}
    ${section("playbook", "学んだ規則（playbook）", (rules || facts) && `${rules ? `<ul>${rules}</ul>` : ""}${facts}`)}
    ${section("problems", "技術的な問題", problems && `<ul>${problems}</ul>`)}
    ${section("thinking", "Claude の思考（最新）", thoughts && `<div class="stream">${thoughts}</div>`)}`;
}

// ---- colony.html: vitals / status strip ----

function statusLine(state) {
  const s = state.status || {};
  if (s.state === "playing") return `<div class="st-main"><i class="dot"></i>プレイ中（${esc(s.model || "?")}）</div>`;
  if (isApiError(state)) return `<div class="st-main">接続待ち・再試行中（${esc(s.attempt ?? "?")} 回目、次 ${s.retry_at ? jstHHMM(s.retry_at) : "未定"}）</div>`;
  if (isUsageLimit(state)) return `<div class="st-main">休憩中${s.limit === "weekly" ? "（週の上限）" : ""} <b>再開 ${s.resume_at ? jstHHMM(s.resume_at) : "未定"}</b></div>`;
  if (s.state === "paused") return '<div class="st-main">一時停止</div>';
  return '<div class="st-main">待機中</div>';
}

function dupeChip(d, withHealth) {
  const health = typeof d.health === "number" && d.health <= 1 ? d.health * 100 : d.health; // bridge may send 0..1
  const pct = typeof d.stress === "number" ? Math.round(d.stress) + "%" : "";
  return `<span class="chip"><span class="name">${esc(d.name)}</span>${bar(d.stress, "stress" + (warn(d) ? " warn" : ""))}<b class="${warn(d) ? "warn-text" : ""}">${pct}</b>${withHealth ? bar(health, "health") : ""}</span>`;
}

function renderDupes(dupes) {
  if (!dupes.length) return "";
  if (dupes.length <= MAX_DUPE_ROWS) {
    return `<div class="dupes"><div class="legend">住人 ${dupes.length}人（ストレス / 体力）</div>${dupes.map((d) => dupeChip(d, true)).join("")}</div>`;
  }
  const top = dupes.filter((d) => typeof d.stress === "number").sort((a, b) => b.stress - a.stress).slice(0, 3);
  return `<div class="dupes"><div class="legend">住人 ${dupes.length}人（ストレスが高い順）</div>${top.map((d) => dupeChip(d, false)).join("")}<span class="chip more">+${dupes.length - top.length} 人</span></div>`;
}

function vitals(v) {
  if (!v) return "";
  const out = [];
  if (typeof v.o2_avg_kg === "number") out.push(`酸素 ${v.o2_avg_kg.toFixed(1)}kg/マス`);
  if (typeof v.food_days === "number") out.push(`食料 残り${v.food_days.toFixed(1)}日`);
  if (typeof v.power_gen_w === "number" && typeof v.power_use_w === "number") {
    const net = Math.round(v.power_gen_w - v.power_use_w);
    out.push(`電力 ${net >= 0 ? "+" : "−"}${Math.abs(net)}W<small>（発電${Math.round(v.power_gen_w)}−消費${Math.round(v.power_use_w)}）</small>`);
  }
  if (typeof v.temp_c === "number") out.push(`温度 ${Math.round(v.temp_c)}℃`);
  return out.map((s) => `<span>${s}</span>`).join("");
}

function goal(ach) {
  if (ach.great_escape) return '<span class="goal">Great Escape 達成！</span>';
  const p = (ach.progress || []).join(" / ");
  const m = /Great Escape:\s*(\d+)\s*\/\s*(\d+)/.exec(p);
  if (m) return `<span class="goal">目標: Great Escape（ロケットで脱出）まで ${m[1]}/${m[2]} 段階</span>`;
  return p ? `<span class="goal">${esc(p)}</span>` : "";
}

function renderColony(state, now) {
  const c = state.colony || {};
  const alerts = c.alerts || [];
  const top = alerts.reduce((m, a) => (!m || (a.severity ?? 0) > (m.severity ?? 0) ? a : m), null);
  const r = c.research;
  // bridge reports progress_pct (P1-21); older states had progress 0..1
  const pct = r && typeof r.progress_pct === "number" ? r.progress_pct
    : r && typeof r.progress === "number" ? Math.round(r.progress <= 1 ? r.progress * 100 : r.progress) : null;
  const alertText = top
    ? `<span class="warn-text">警告: ${esc(top.text)}${alerts.length > 1 ? `<small>（ほか${alerts.length - 1}件）</small>` : ""}</span>`
    : "<span>警告なし</span>";
  return `
    <div class="main">
      <div class="row row1"><span>${esc(state.run || "run-?")}</span>
        <span>サイクル ${typeof c.cycle === "number" ? c.cycle + 1 : "-"}</span>${alertText}
        ${state.colony_ok === false ? '<span class="warn-text">ゲームと未接続</span>' : ""}</div>
      <div class="row row2">${vitals(c.vitals)}</div>
      <div class="row row3"><span>研究: ${r && r.current ? `${esc(r.current)} ${pct ?? "-"}%` : "なし"}</span>${goal(c.achievements || {})}</div>
    </div>
    <div class="side">${statusLine(state)}${renderDupes(c.dupes || [])}${state.board_url ? `<div class="board-url">作戦ボード: ${esc(state.board_url)}</div>` : ""}</div>
    ${chrome(state, now)}`;
}

function render(page, state, now) {
  state = state || {};
  now = now || new Date();
  if (page === "break") return renderBreak(state);
  if (page === "board") return renderBoard(state);
  return page === "colony" ? renderColony(state, now) : renderThinking(state, now);
}

if (typeof module !== "undefined") module.exports = { render, jstHHMM };

if (typeof document !== "undefined") {
  const page = document.body.dataset.page;
  const root = document.getElementById("root");
  let last = {};
  const draw = () => { root.innerHTML = render(page, last, new Date()); };
  const connect = () => {
    const es = new EventSource("/events");
    es.addEventListener("state", (e) => { last = JSON.parse(e.data); draw(); });
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  };
  setInterval(draw, 5000); // so 考え中… appears even when the stream is silent
  const embedded = document.getElementById("state"); // static snapshot (scripts/publish_board.py): no server
  if (embedded) last = JSON.parse(embedded.textContent);
  draw();
  if (!embedded) connect();
  // The published page (GitHub Pages) has no /events: re-read state.json, which publish_board.py pushes every 5 minutes
  else setInterval(() => fetch("state.json", { cache: "no-store" }).then((r) => r.json()).then((s) => { last = s; draw(); }).catch(() => {}), 60000);
}
</script>
</body>
</html>
